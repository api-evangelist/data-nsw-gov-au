apis:
  - aid: data-nsw-gov-au:catalog
    name: NSW Government Open Data CKAN Action API
    description: >-
      CKAN Action API for NSW Government Open Data, a consistent JSON-over-HTTP interface over a catalog of 16,907 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://data.nsw.gov.au/data/api/3/action/.
