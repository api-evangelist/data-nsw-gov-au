aid: data-nsw-gov-au
name: NSW Government Open Data
description: >-
  NSW Government Open Data is a state government open-data portal for Australia running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 16,907 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
